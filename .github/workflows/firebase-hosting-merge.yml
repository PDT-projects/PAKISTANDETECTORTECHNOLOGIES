# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create env file for build
        run: |
          cat << EOF > .env.production
          VITE_INVOICE_TEMPLATE=detector
          VITE_COMPANY_NAME_LINE1=PAKISTAN
          VITE_COMPANY_NAME_LINE2=DETECTOR TECHNOLOGIES
          VITE_COMPANY_TAGLINE=Enterprise Finance System
          VITE_COMPANY_DESCRIPTION=Secure financial management platform built for enterprise operations, reporting, and office workflow management across Pakistan.
          VITE_COMPANY_LOGO=/PDTLogo.jpg
          VITE_COMPANY_LOGO_ALT=Pakistan Detector Technologies logo
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          EOF
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAKISTANDETECTORSTECHNOLOGIES }}
          channelId: live
          projectId: pakistandetectorstechnologies
